<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이력서 메이커 파이프라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html, body { margin: 0; padding: 0; background: #f3f6fb; }
  svg { display: block; font-family: Pretendard, "Malgun Gothic", sans-serif; }
  .t { fill: #1e2a4a; }
  .g { fill: #5c6476; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; }
</style>
</head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e2a4a" flood-opacity="0.08"/>
    </filter>
    <marker id="aDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4256"/>
    </marker>
  </defs>

  <!-- 제목 -->
  <text x="60" y="72" font-size="40" font-weight="800" class="t">이력서 메이커로 이력서를 만들고 공개하기까지</text>
  <text x="60" y="112" font-size="20" class="g">사용자 —(HTTPS + 로그인 쿠키)→ Vercel 서버리스 함수 —(서버 안에서만 쓰는 secret 키)→ Supabase(서울)</text>

  <!-- ① 사용하는 사람 -->
  <g filter="url(#sh)">
    <rect x="50" y="160" width="330" height="600" rx="18" fill="#fff" stroke="#ffd8b5" stroke-width="2"/>
  </g>
  <path d="M68 160 H362 a18 18 0 0 1 18 18 V230 H50 V178 a18 18 0 0 1 18 -18 z" fill="#fff3e8"/>
  <line x1="50" y1="230" x2="380" y2="230" stroke="#ffd8b5" stroke-width="2"/>
  <text x="78" y="205" font-size="26" font-weight="800" fill="#e8590c">① 사용하는 사람</text>
  <text x="78" y="268" font-size="18" class="g">누구나 브라우저 하나로 (PC·휴대폰)</text>

  <rect x="76" y="292" width="278" height="74" rx="10" fill="#f8f9fb" stroke="#dfe3ea"/>
  <text x="96" y="323" font-size="19" font-weight="700" class="t">지원자 · /app</text>
  <text x="96" y="351" font-size="15" class="g">내용 편집 · 서식 5종 · 사진·첨부</text>

  <rect x="76" y="382" width="278" height="74" rx="10" fill="#f8f9fb" stroke="#dfe3ea"/>
  <text x="96" y="413" font-size="19" font-weight="700" class="t">운영자 · /owner</text>
  <text x="96" y="441" font-size="15" class="g">모든 이력서 수정 · 권한 · 비밀번호</text>

  <rect x="76" y="472" width="278" height="74" rx="10" fill="#f8f9fb" stroke="#dfe3ea"/>
  <text x="96" y="503" font-size="19" font-weight="700" class="t">보는 사람 · /r/주소</text>
  <text x="96" y="531" font-size="15" class="g">로그인 없이 열람 · 인쇄해 PDF 저장</text>

  <rect x="76" y="578" width="278" height="152" rx="12" fill="#fff4e6" stroke="#ffd8a8"/>
  <text x="96" y="613" font-size="19" font-weight="800" fill="#e8590c">브라우저엔 비밀 키 없음</text>
  <text x="96" y="645" font-size="16" class="g">비밀번호는 scrypt 해시로만 보관</text>
  <text x="96" y="672" font-size="16" class="g">로그인은 서명한 HttpOnly 쿠키</text>
  <text x="96" y="699" font-size="16" class="g">14일 유지, 로그아웃하면 삭제</text>

  <!-- 화살표 1 -->
  <text x="438" y="392" font-size="17" font-weight="800" fill="#e8590c" text-anchor="middle">HTTPS 443</text>
  <line x1="386" y1="430" x2="470" y2="430" stroke="#e8590c" stroke-width="5"/>
  <path d="M466 414 L496 430 L466 446 z" fill="#e8590c"/>
  <text x="438" y="470" font-size="15" fill="#e8590c" text-anchor="middle">+ 로그인 쿠키</text>

  <!-- ② Vercel -->
  <g filter="url(#sh)">
    <rect x="500" y="160" width="580" height="600" rx="18" fill="#fff" stroke="#b9d3f2" stroke-width="2"/>
  </g>
  <path d="M518 160 H1062 a18 18 0 0 1 18 18 V230 H500 V178 a18 18 0 0 1 18 -18 z" fill="#e8f1fc"/>
  <line x1="500" y1="230" x2="1080" y2="230" stroke="#b9d3f2" stroke-width="2"/>
  <text x="528" y="205" font-size="26" font-weight="800" fill="#1c5fb8">② Vercel · Hobby(무료) 서버리스</text>

  <text x="526" y="262" font-size="16" class="g">저장소: JobCreation/web-porfolio · main에 push하면 자동 배포</text>
  <text x="526" y="289" font-size="16" class="g">주소: web-porfolio-seungwoo489-9026s-projects.vercel.app</text>

  <rect x="526" y="310" width="528" height="46" rx="10" fill="#fff9db" stroke="#ffe066"/>
  <text x="546" y="339" font-size="16" font-weight="800" fill="#1c5fb8">vercel.json 주소 규칙</text>
  <text x="726" y="339" font-size="16" class="g">/ → /platform · /app · /owner · /r/:주소</text>

  <rect x="526" y="374" width="528" height="268" rx="12" fill="#f2f7fe" stroke="#9cc3f0" stroke-dasharray="7 6" stroke-width="1.5"/>
  <text x="546" y="404" font-size="17" font-weight="800" fill="#1c5fb8">한 저장소 안에서 (외부 라이브러리 0개)</text>

  <!-- 상자 A: 화면 -->
  <rect x="546" y="422" width="152" height="200" rx="12" fill="#fff" stroke="#74a9e8" stroke-width="2"/>
  <text x="622" y="456" font-size="21" font-weight="800" fill="#1c5fb8" text-anchor="middle">화면</text>
  <text x="622" y="484" font-size="13" class="g mono" text-anchor="middle">platform/</text>
  <text x="622" y="514" font-size="15" class="g" text-anchor="middle">들머리·편집</text>
  <text x="622" y="538" font-size="15" class="g" text-anchor="middle">운영자·공개</text>
  <text x="622" y="562" font-size="15" class="g" text-anchor="middle">서식 5종 그리기</text>
  <text x="622" y="604" font-size="13" fill="#8a92a3" text-anchor="middle">정적 파일</text>

  <line x1="700" y1="522" x2="712" y2="522" stroke="#3b4256" stroke-width="3" marker-end="url(#aDark)"/>

  <!-- 상자 B: API 함수 (강조) -->
  <rect x="714" y="422" width="152" height="200" rx="12" fill="#fff" stroke="#4d94e8" stroke-width="3.5"/>
  <text x="790" y="456" font-size="21" font-weight="800" fill="#1c5fb8" text-anchor="middle">API 함수</text>
  <text x="790" y="484" font-size="13" class="g mono" text-anchor="middle">api/*.mjs</text>
  <text x="790" y="514" font-size="15" class="g" text-anchor="middle">가입·로그인·권한</text>
  <text x="790" y="538" font-size="15" class="g" text-anchor="middle">이력서 저장</text>
  <text x="790" y="562" font-size="15" class="g" text-anchor="middle">사진·첨부 6MB</text>
  <text x="790" y="604" font-size="13" fill="#8a92a3" text-anchor="middle">/api/…</text>

  <line x1="868" y1="522" x2="880" y2="522" stroke="#3b4256" stroke-width="3" marker-end="url(#aDark)"/>

  <!-- 상자 C: store.mjs -->
  <rect x="882" y="422" width="152" height="200" rx="12" fill="#fff" stroke="#74a9e8" stroke-width="2"/>
  <text x="958" y="456" font-size="21" font-weight="800" fill="#1c5fb8" text-anchor="middle">자료 보관</text>
  <text x="958" y="484" font-size="13" class="g mono" text-anchor="middle">store.mjs</text>
  <text x="958" y="514" font-size="15" class="g" text-anchor="middle">Supabase</text>
  <text x="958" y="538" font-size="15" class="g" text-anchor="middle">REST·Storage 호출</text>
  <text x="958" y="562" font-size="15" class="g" text-anchor="middle">키는 환경변수</text>
  <text x="958" y="604" font-size="13" fill="#8a92a3" text-anchor="middle">서버 안에서만</text>

  <rect x="526" y="662" width="528" height="74" rx="12" fill="#f3f0ff" stroke="#c5b5f5"/>
  <text x="546" y="692" font-size="18" font-weight="800" fill="#6741d9">환경변수 (Vercel Settings)</text>
  <text x="546" y="719" font-size="14" class="g mono">SUPABASE_URL · SERVICE_KEY · SESSION_SECRET · OWNER_EMAIL</text>

  <!-- 화살표 2 -->
  <text x="1135" y="638" font-size="16" font-weight="800" fill="#6741d9" text-anchor="middle">Supabase</text>
  <text x="1135" y="662" font-size="14" fill="#6741d9" text-anchor="middle">HTTPS API</text>
  <line x1="1084" y1="699" x2="1160" y2="699" stroke="#7048e8" stroke-width="5"/>
  <path d="M1156 683 L1186 699 L1156 715 z" fill="#7048e8"/>
  <text x="1135" y="738" font-size="14" fill="#6741d9" text-anchor="middle">secret 키</text>

  <!-- ③ Supabase -->
  <g filter="url(#sh)">
    <rect x="1190" y="160" width="360" height="600" rx="18" fill="#fff" stroke="#b2ebc0" stroke-width="2"/>
  </g>
  <path d="M1208 160 H1532 a18 18 0 0 1 18 18 V230 H1190 V178 a18 18 0 0 1 18 -18 z" fill="#ebfbee"/>
  <line x1="1190" y1="230" x2="1550" y2="230" stroke="#b2ebc0" stroke-width="2"/>
  <text x="1218" y="205" font-size="26" font-weight="800" fill="#2b8a3e">③ Supabase · 서울</text>
  <text x="1216" y="268" font-size="18" class="g">자료를 실제로 보관하는 곳 (Free)</text>

  <rect x="1216" y="292" width="308" height="214" rx="14" fill="#fff" stroke="#40c057" stroke-width="3"/>
  <text x="1370" y="330" font-size="24" font-weight="800" fill="#2b8a3e" text-anchor="middle">Postgres</text>
  <text x="1370" y="356" font-size="15" class="g" text-anchor="middle">표 3개 · 500MB까지 무료</text>
  <rect x="1238" y="372" width="264" height="36" rx="8" fill="#ebfbee"/>
  <text x="1256" y="396" font-size="15" font-weight="800" fill="#2b8a3e">users</text>
  <text x="1340" y="396" font-size="15" class="g">이메일 · 해시 · 권한</text>
  <rect x="1238" y="414" width="264" height="36" rx="8" fill="#f4f6f9"/>
  <text x="1256" y="438" font-size="15" font-weight="800" fill="#2b8a3e">resumes</text>
  <text x="1340" y="438" font-size="15" class="g">서식 · 주소 · 내용</text>
  <rect x="1238" y="456" width="264" height="36" rx="8" fill="#f4f6f9"/>
  <text x="1256" y="480" font-size="15" font-weight="800" fill="#2b8a3e">files</text>
  <text x="1340" y="480" font-size="15" class="g">첨부파일 목록</text>

  <rect x="1216" y="524" width="308" height="108" rx="12" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="1236" y="557" font-size="19" font-weight="800" fill="#e03131">RLS(행 보안) 켜짐</text>
  <text x="1236" y="586" font-size="16" class="g">브라우저에서 직접 읽기·쓰기 차단</text>
  <text x="1236" y="612" font-size="16" class="g">서버의 secret 키만 접근 가능</text>

  <rect x="1216" y="662" width="308" height="74" rx="12" fill="#f3f0ff" stroke="#c5b5f5"/>
  <text x="1236" y="692" font-size="18" font-weight="800" fill="#6741d9">Storage 보관함: uploads</text>
  <text x="1236" y="719" font-size="15" class="g">사진·첨부 · Public · 1GB 무료</text>

  <!-- 아래 요약 띠 -->
  <rect x="50" y="790" width="1500" height="74" rx="14" fill="#1e2a44"/>
  <text x="80" y="835" font-size="21" font-weight="600" fill="#fff">✓ 결제 없음 · 무료 플랜만 사용</text>
  <text x="560" y="835" font-size="21" font-weight="600" fill="#fff">✓ 비밀 키는 Vercel 환경변수에만 보관</text>
  <text x="1080" y="835" font-size="21" font-weight="600" fill="#fff">✓ git push 하면 1분 안에 자동 재배포</text>
</svg>
</body>
</html>
