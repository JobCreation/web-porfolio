<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <meta name="description" content="프로젝트와 이력을 정리한 개인 포트폴리오">
  <script>
    // 저장해 둔 화면 모드를 그리기 전에 적용 (깜빡임 방지)
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div class="top">
    <div class="wrap">
      <a class="brand" href="#top" id="brand">Portfolio<i>.</i></a>
      <nav class="nav" id="nav" aria-label="섹션 이동"></nav>
      <button class="theme" id="theme" type="button" aria-label="밝은 화면 / 어두운 화면 전환">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
  </div>

  <main id="top">
    <div class="wrap state" id="state">불러오는 중…</div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <span id="copy"></span>
      <a href="admin/">관리자</a>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>
</body>
</html>
